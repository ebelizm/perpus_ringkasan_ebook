name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor
        run: npm install --no-save @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets

      - name: Siapkan www/ + project Android
        run: node scripts/prepare-android.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Catatan: AAPT2 menghapus ekstensi .gz DAN mendekompresi isinya saat
      # packaging assets (Capacitor #5844) — content-N.json.gz menjadi
      # content-N.json berisi JSON biasa. Verifikasi: jumlah file + isi valid.
      - name: Verifikasi APK berisi data lengkap
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          N=$(unzip -l "$APK" | grep -cE "assets/public/data/.*\.json$" || true)
          echo "File data di APK: $N"
          if [ "$N" -lt 21 ]; then
            echo "::error::Data tidak lengkap ($N/21 file)"
            exit 1
          fi
          for f in index content-0 content-19; do
            MAGIC=$(unzip -p "$APK" "assets/public/data/$f.json" | head -c 2 | od -An -tx1 | tr -d ' \n')
            echo "$f.json magic: $MAGIC"
            if [ "$MAGIC" = "1f8b" ]; then
              unzip -p "$APK" "assets/public/data/$f.json" | zcat | python3 -m json.tool > /dev/null \
                || { echo "::error::$f.json: stream gzip tidak valid"; exit 1; }
            elif [ "$MAGIC" = "7b22" ]; then
              unzip -p "$APK" "assets/public/data/$f.json" | python3 -m json.tool > /dev/null \
                || { echo "::error::$f.json: JSON tidak valid"; exit 1; }
            else
              echo "::error::$f.json: magic tak dikenal ($MAGIC)"
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perpustakaan-ringkasan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Ukuran APK
        if: always()
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk || true
