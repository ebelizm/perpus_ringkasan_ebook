name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # untuk mengunggah APK ke Release (link unduh yang stabil)

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Cache Gradle (wrapper + dependensi) — project android/ dibuat ulang tiap
      # run, jadi tanpa cache semua dependensi diunduh ulang setiap kali.
      # v5 (bukan v6): gradle/actions v6 mengubah lisensi caching.
      - uses: gradle/actions/setup-gradle@v5

      - name: Install Capacitor
        # Pin major 8 agar project Android yang dibuat ulang tiap run tetap
        # stabil — lompatan major Capacitor tidak boleh memecah CI tiba-tiba.
        run: npm install --no-save @capacitor/cli@8 @capacitor/core@8 @capacitor/android@8 @capacitor/assets

      - name: Siapkan www/ + project Android
        run: node scripts/prepare-android.mjs

      - name: Build release APK (R8 + shrink resources)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Catatan: AAPT2 menghapus ekstensi .gz DAN mendekompresi isinya saat
      # packaging assets (Capacitor #5844) — content-N.json.gz menjadi
      # content-N.json berisi JSON biasa. Verifikasi: jumlah file + isi valid.
      - name: Verifikasi APK berisi data lengkap
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          N=$(unzip -l "$APK" | grep -cE "assets/public/data/.*\.json$" || true)
          echo "File data di APK: $N"
          if [ "$N" -lt 21 ]; then
            echo "::error::Data tidak lengkap ($N/21 file)"
            exit 1
          fi
          for f in index content-0 content-19; do
            MAGIC=$(unzip -p "$APK" "assets/public/data/$f.json" | head -c 2 | od -An -tx1 | tr -d ' \n')
            echo "$f.json magic: $MAGIC"
            if [ "$MAGIC" = "1f8b" ]; then
              unzip -p "$APK" "assets/public/data/$f.json" | zcat | python3 -m json.tool > /dev/null \
                || { echo "::error::$f.json: stream gzip tidak valid"; exit 1; }
            elif [ "$MAGIC" = "7b22" ]; then
              unzip -p "$APK" "assets/public/data/$f.json" | python3 -m json.tool > /dev/null \
                || { echo "::error::$f.json: JSON tidak valid"; exit 1; }
            else
              echo "::error::$f.json: magic tak dikenal ($MAGIC)"
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: perpustakaan-ringkasan-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Ukuran APK
        if: always()
        run: ls -lh android/app/build/outputs/apk/release/app-release.apk || true

      # Satu release berlabel "apk" yang selalu ditimpa, bukan tag per build:
      # pengguna cukup punya satu URL stabil untuk mengunduh versi terbaru
      # (artifact Actions sendiri kedaluwarsa setelah 90 hari).
      - name: Publish ke GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION=$(grep -oE 'versionName\s+"[^"]+"' android/app/build.gradle | grep -oE '"[^"]+"' | tr -d '"')
          NOTE="APK build \`${{ github.sha }}\` (versionName $VERSION). Data katalog ikut terisi di dalam APK — unduh ulang utuh saat memasang."
          if gh release view apk > /dev/null 2>&1; then
            gh release upload apk "$APK" --clobber
            gh release edit apk --title "Ringgo Book (APK terbaru)" --notes "$NOTE" > /dev/null
          else
            gh release create apk "$APK" --title "Ringgo Book (APK terbaru)" --notes "$NOTE"
          fi
          echo "Download: $(gh release view apk --json url -q .url)"
