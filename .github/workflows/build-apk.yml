name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor
        run: npm install --no-save @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets

      - name: Siapkan www/ + project Android
        run: node scripts/prepare-android.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verifikasi APK hanya berisi data gzip
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          RAW=$(unzip -l "$APK" | grep -cE "assets/public/data/.*\.json$" || true)
          GZ=$(unzip -l "$APK" | grep -c "\.json\.gz" || true)
          echo "JSON mentah: $RAW | gzip: $GZ"
          if [ "$RAW" != "0" ]; then
            echo "::error::APK masih berisi JSON mentah ($RAW file)"
            exit 1
          fi
          if [ "$GZ" -lt 20 ]; then
            echo "::error::Data gzip tidak lengkap ($GZ/21 file)"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perpustakaan-ringkasan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Ukuran APK
        if: always()
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk || true
